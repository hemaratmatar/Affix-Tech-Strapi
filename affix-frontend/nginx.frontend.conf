# Internal static server for the built React SPA.
# No TLS / proxy logic here — the top-level nginx edge (see nginx/conf.d)
# terminates TLS and forwards to this container on the "edge" network.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public";
    }
}
