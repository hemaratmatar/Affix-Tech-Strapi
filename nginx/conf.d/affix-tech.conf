# Edge reverse proxy — affix-tech.com (frontend) + api.affix-tech.com (Strapi)
#
# Bootstrap note: on a brand-new host there is no certificate yet under
# /etc/letsencrypt/live/<domain>/, so nginx will fail to start with the
# "ssl_certificate" lines below present. Run the HTTP-only bootstrap first:
#   1. temporarily rename/disable this file and use nginx/conf.d/bootstrap.conf
#      (HTTP-only, see that file) to serve the ACME challenge
#   2. `make certbot-init` to obtain the first certificate
#   3. switch back to this file and `docker compose ... restart nginx`
# See doc/06-deployment-and-operations.md for the full sequence.

# ---- affix-tech.com (static frontend) ----
server {
    listen 80;
    server_name affix-tech.com www.affix-tech.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name affix-tech.com www.affix-tech.com;

    ssl_certificate     /etc/letsencrypt/live/affix-tech.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/affix-tech.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ---- api.affix-tech.com (Strapi backend) ----
server {
    listen 80;
    server_name api.affix-tech.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.affix-tech.com;

    ssl_certificate     /etc/letsencrypt/live/api.affix-tech.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.affix-tech.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    client_max_body_size 50m;

    location / {
        proxy_pass http://strapi-backend:1337;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }
}
