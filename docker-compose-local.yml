name: affix-tech-local
services:
  mysql:
    image: mysql:8.0
    command: ["mysqld", "--default-authentication-plugin=mysql_native_password"]
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in affix-backend/.env.dev}
      MYSQL_DATABASE: ${DATABASE_NAME:-affix}
      MYSQL_USER: strapi_local
      MYSQL_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in affix-backend/.env.dev}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - affix_demo_mysql_data:/var/lib/mysql
      # Demo SQL fixture lives outside git (see .gitignore); point this at a
      # local path on your machine, e.g. ./seed/affix-demo.sql
      - ${LOCAL_DEMO_SQL_PATH:-./seed/affix-demo.sql}:/docker-entrypoint-initdb.d/01-affix-demo.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks:
      - affix-local

  strapi-backend:
    build:
      context: ./affix-backend
      dockerfile: Dockerfile.local
    restart: unless-stopped
    env_file:
      - ./affix-backend/.env.dev
    environment:
      HOST: 0.0.0.0
      PORT: 1337
      DATABASE_CLIENT: mysql
      DATABASE_HOST: mysql
      DATABASE_PORT: 3306
      DATABASE_NAME: ${DATABASE_NAME:-affix}
      DATABASE_USERNAME: strapi_local
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in affix-backend/.env.dev}
      DATABASE_SSL: "false"
    ports:
      - "127.0.0.1:1337:1337"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - affix-local

  affix-frontend:
    build:
      context: ./affix-frontend
      dockerfile: Dockerfile.local
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      REACT_APP_BASE_URL: http://localhost:1337/api
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - strapi-backend
    networks:
      - affix-local

networks:
  affix-local:
    driver: bridge

volumes:
  affix_demo_mysql_data:
    name: affix-tech-demo-mysql
